<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified 4D Visualization Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #visualization {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            min-width: 250px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        
        .control-group select {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .btn {
            padding: 8px 12px;
            background: #444;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .btn:hover {
            background: #555;
        }
        
        .btn.active {
            background: #0a84ff;
        }
        
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 11px;
            line-height: 1.4;
        }
        
        .info h3 {
            margin: 0 0 10px 0;
            color: #0a84ff;
        }
        
        .fps {
            color: #00ff00;
            font-weight: bold;
        }
        
        .status {
            margin-top: 10px;
            padding: 5px 0;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="visualization"></canvas>
        
        <div class="controls">
            <h3 style="margin: 0 0 15px 0; color: #0a84ff;">Unified 4D Engine</h3>
            
            <div class="button-group">
                <button class="btn active" onclick="setGeometry('hypercube')">Hypercube</button>
                <button class="btn" onclick="setGeometry('tetrahedron')">Tetrahedron</button>
                <button class="btn" onclick="setGeometry('sphere')">Sphere</button>
            </div>
            
            <div class="button-group">
                <button class="btn" onclick="toggleEngine()">Start/Stop</button>
                <button class="btn" onclick="resetParameters()">Reset</button>
            </div>
            
            <div class="control-group">
                <label>Dimension: <span id="dimensionValue">4.0</span></label>
                <input type="range" id="dimension" min="3.0" max="5.0" step="0.1" value="4.0" oninput="updateParameter('dimension', this.value)">
            </div>
            
            <div class="control-group">
                <label>Morph Factor: <span id="morphFactorValue">0.5</span></label>
                <input type="range" id="morphFactor" min="0.0" max="2.0" step="0.1" value="0.5" oninput="updateParameter('morphFactor', this.value)">
            </div>
            
            <div class="control-group">
                <label>Rotation Speed: <span id="rotationSpeedValue">0.2</span></label>
                <input type="range" id="rotationSpeed" min="0.0" max="3.0" step="0.1" value="0.2" oninput="updateParameter('rotationSpeed', this.value)">
            </div>
            
            <div class="control-group">
                <label>Grid Density: <span id="gridDensityValue">8.0</span></label>
                <input type="range" id="gridDensity" min="1.0" max="25.0" step="0.5" value="8.0" oninput="updateParameter('gridDensity', this.value)">
            </div>
            
            <div class="control-group">
                <label>Line Thickness: <span id="lineThicknessValue">0.03</span></label>
                <input type="range" id="lineThickness" min="0.005" max="0.1" step="0.005" value="0.03" oninput="updateParameter('lineThickness', this.value)">
            </div>
            
            <div class="control-group">
                <label>Theme:</label>
                <select onchange="setTheme(this.value)" id="themeSelector">
                    <option value="hypercube">Hypercube (Magenta)</option>
                    <option value="tetrahedron">Tetrahedron (Cyan)</option>
                    <option value="hypersphere">Hypersphere (Yellow)</option>
                    <!-- Add other themes as geometries are implemented -->
                </select>
            </div>

            <h4 style="margin: 15px 0 10px 0; color: #0a84ff; border-top: 1px solid #333; padding-top: 15px;">Custom Reactivity</h4>
            <div class="control-group">
                <label>Target Parameter:</label>
                <select id="reactivityTarget">
                    <option value="morphFactor">Morph Factor</option>
                    <option value="gridDensity">Grid Density</option>
                    <option value="rotationSpeed">Rotation Speed</option>
                    <option value="lineThickness">Line Thickness</option>
                    <option value="audioBass">Audio Bass (Override)</option>
                    <option value="audioMid">Audio Mid (Override)</option>
                    <option value="audioHigh">Audio High (Override)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Source Type:</label>
                <select id="reactivitySource">
                    <option value="scrollIntensity">Scroll Intensity</option>
                    <option value="clickIntensity">Click Intensity</option>
                    <option value="mouseVelocity">Mouse Velocity</option>
                    <option value="mousePositionX">Mouse X</option>
                    <option value="mousePositionY">Mouse Y</option>
                    <option value="time">Time</option>
                    <option value="custom:agentValue1">Custom: agentValue1</option>
                </select>
            </div>
            <div class="control-group">
                <label>Scale: <span id="reactivityScaleValue">1.0</span></label>
                <input type="range" id="reactivityScale" min="-5.0" max="5.0" step="0.1" value="1.0" oninput="document.getElementById('reactivityScaleValue').textContent = parseFloat(this.value).toFixed(1)">
            </div>
             <div class="control-group">
                <label>Smoothing (0=instant, 0.99=slow): <span id="reactivitySmoothingValue">0.0</span></label>
                <input type="range" id="reactivitySmoothing" min="0.0" max="0.99" step="0.01" value="0.0" oninput="document.getElementById('reactivitySmoothingValue').textContent = parseFloat(this.value).toFixed(2)">
            </div>
            <div class="button-group">
                <button class="btn" onclick="applyReactivityMapping()">Apply Mapping</button>
                <button class="btn" onclick="clearReactivityMappings()">Clear Mappings</button>
            </div>

            <div class="control-group" style="border-top: 1px solid #333; padding-top: 10px;">
                <label>Custom Source Name: <input type="text" id="customSourceName" value="agentValue1" style="width: 100px; background: #333; color: #fff; border: 1px solid #555;"></label>
                <label>Value: <span id="customSourceValueDisplay">0.5</span></label>
                <input type="range" id="customSourceValue" min="0.0" max="1.0" step="0.01" value="0.5" oninput="updateCustomReactivityValue(this.value)">
            </div>

        </div>
        
        <div class="info">
            <h3>🚀 Autonomous Development Test</h3>
            <div>FPS: <span class="fps" id="fps">--</span></div>
            <div>WebGL: <span id="webglVersion">--</span></div>
            <div>Canvas: <span id="canvasSize">--</span></div>
            <div>Interactions: <span id="interactions">--</span></div>
            
            <div class="status">
                <strong>Status:</strong> <span id="status">Initializing...</span>
            </div>
            
            <div style="margin-top: 10px; font-size: 10px; color: #888;">
                🤖 Created by Claude Code Agentic System<br>
                📦 @unified4d/visualization-engine v1.0.0<br>
                🎯 Test scroll, click, and mouse movement!
            </div>
        </div>
    </div>

    <script type="module">
        // Import the actual engine
        import { Unified4DEngine } from '../src/core/Unified4DEngine.js';

        // FPS Counter
        class FPSCounter {
            constructor() {
                this.frameCount = 0;
                this.lastTime = 0;
                this.fps = 0;
            }
            
            update(timestamp) {
                this.frameCount++;
                if (timestamp - this.lastTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (timestamp - this.lastTime));
                    this.frameCount = 0;
                    this.lastTime = timestamp;
                    const fpsEl = document.getElementById('fps');
                    if (fpsEl) fpsEl.textContent = this.fps;
                }
            }
        }

        // Global variables
        let engine = null;
        window.fpsCounter = new FPSCounter();

        // Themes - keys should ideally match GeometryType values or have a clear mapping
        const themes = {
            hypercube: { // Corresponds to 'HYPERCUBE'
                primary: [1.0, 0.2, 0.8],
                secondary: [0.2, 1.0, 1.0],
                background: [0.05, 0.0, 0.2]
            },
            tetrahedron: { // Corresponds to 'TETRAHEDRON'
                primary: [0.2, 1.0, 1.0],
                secondary: [1.0, 1.0, 1.0],
                background: [0.0, 0.1, 0.2]
            },
            hypersphere: { // Corresponds to 'HYPERSPHERE' (was 'sphere' in HTML)
                primary: [1.0, 1.0, 0.0],
                secondary: [1.0, 0.5, 0.0],
                background: [0.1, 0.1, 0.0]
            }
            // Add other themes as new geometries are fully implemented
        };

        const geometryButtonMapping = {
            'HYPERCUBE_BTN': 'HYPERCUBE',
            'TETRAHEDRON_BTN': 'TETRAHEDRON',
            'HYPERSPHERE_BTN': 'HYPERSPHERE'
        };

        // Initialize
        function init() {
            const canvas = document.getElementById('visualization');
            if (!canvas) {
                console.error("Canvas element #visualization not found!");
                updateStatus('❌ Initialization failed: Canvas not found.');
                return;
            }
            
            try {
                engine = new Unified4DEngine(canvas, {
                    geometry: 'HYPERCUBE', // Default geometry key from GeometryType
                    theming: themes.hypercube
                });
                
                engine.start();
                updateStatus('Running successfully! 🚀');
                
                document.getElementById('webglVersion').textContent = engine.isWebGL2 ? 'WebGL 2.0' : 'WebGL 1.0';
                updateCanvasSize();
                setupButtonListeners();
                
            } catch (error) {
                console.error('Failed to initialize Unified4DEngine:', error);
                updateStatus('❌ Initialization failed: ' + error.message);
            }
        }

        function setupButtonListeners() {
            // Add IDs to buttons in HTML if they don't have them for easier selection
            // Or use a more robust selector
            document.querySelector('.button-group button[onclick*="hypercube"]').id = 'HYPERCUBE_BTN';
            document.querySelector('.button-group button[onclick*="tetrahedron"]').id = 'TETRAHEDRON_BTN';
            // The sphere button needs its onclick updated to 'hypersphere' and an ID
            const sphereBtn = document.querySelector('.button-group button[onclick*="sphere"]');
            if(sphereBtn) {
                sphereBtn.id = 'HYPERSPHERE_BTN';
                sphereBtn.setAttribute('onclick', "setGeometry('HYPERSPHERE')"); // Corrected key
                sphereBtn.textContent = 'Hypersphere'; // Update text to match
            }


            Object.keys(geometryButtonMapping).forEach(btnId => {
                const button = document.getElementById(btnId);
                if (button) {
                    // Remove existing onclick, add event listener
                    const geometryKey = geometryButtonMapping[btnId];
                    button.onclick = null;
                    button.addEventListener('click', (event) => window.setGeometry(geometryKey, event.currentTarget));
                }
            });
        }

        // Control functions
        window.updateParameter = function(name, value) {
            if (!engine) return;
            
            const numValue = parseFloat(value);
            engine.updateParameters({ [name]: numValue });
            
            const valueSpan = document.getElementById(name + 'Value');
            if (valueSpan) {
                let precision = 2;
                if (name === 'lineThickness') precision = 3;
                if (name === 'dimension') precision = 1;
                valueSpan.textContent = numValue.toFixed(precision);
            }
        };

        window.setGeometry = function(geometryKey, clickedButton) { // geometryKey is 'HYPERCUBE', 'HYPERSPHERE', etc.
            if (!engine) return;
            
            document.querySelectorAll('.button-group .btn').forEach(btn => btn.classList.remove('active'));
            if(clickedButton) clickedButton.classList.add('active');
            
            const themeKey = geometryKey.toLowerCase();
            if (themes[themeKey]) {
                engine.updateConfig({ theming: themes[themeKey] });
                const themeSelect = document.querySelector('.controls select[onchange*="setTheme"]');
                if (themeSelect) themeSelect.value = themeKey;
            }
            
            engine.updateConfig({ geometry: geometryKey }); // Use the exact key from GeometryType
            updateStatus(\`Switched to \${geometryKey} geometry\`);
        };

        window.setTheme = function(themeNameLowerCase) { // e.g., 'hypercube'
            if (!engine || !themes[themeNameLowerCase]) return;
            engine.updateConfig({ theming: themes[themeNameLowerCase] });
            updateStatus(\`Theme set to \${themeNameLowerCase}\`);
        };

        window.toggleEngine = function() {
            if (!engine) return;
            if (engine.isRendering) {
                engine.stop();
                updateStatus('Stopped');
            } else {
                engine.start();
                updateStatus('Running');
            }
        };

        window.resetParameters = function() {
            if (!engine) return;
            
            const defaults = { /* Consider fetching from engine's initial/default config in future */
                dimension: 4.0,
                morphFactor: 0.5,
                rotationSpeed: 0.2,
                gridDensity: 8.0,
                lineThickness: 0.03
            };
            engine.updateParameters(defaults);
            
            Object.entries(defaults).forEach(([key, value]) => {
                const input = document.getElementById(key);
                if (input) input.value = value;
                const valueSpan = document.getElementById(key + 'Value');
                if (valueSpan) {
                     let precision = 2;
                     if (key === 'lineThickness') precision = 3;
                     if (key === 'dimension') precision = 1;
                     valueSpan.textContent = value.toFixed(precision);
                }
            });
            updateStatus('Parameters reset to defaults');
        };

        function updateStatus(message) {
            const statusEl = document.getElementById('status');
            if (statusEl) statusEl.textContent = message;
        }

        function updateCanvasSize() {
            const canvas = document.getElementById('visualization');
            const canvasSizeEl = document.getElementById('canvasSize');
            if (canvas && canvasSizeEl) {
                canvasSizeEl.textContent = \`\${canvas.width}x\${canvas.height}\`;
            }
        }

        function updateInteractionInfo() {
            if (!engine || !engine.getConfig || !engine.getConfig().parameters) return;
            
            const params = engine.getConfig().parameters;
            const interactions = [
                \`Bass: \${(params.audioBass * 100).toFixed(0)}%\`,
                \`Mid: \${(params.audioMid * 100).toFixed(0)}%\`,
                \`High: \${(params.audioHigh * 100).toFixed(0)}%\`
            ].join(' | ');
            const interactionsEl = document.getElementById('interactions');
            if (interactionsEl) interactionsEl.textContent = interactions;
        }

        window.addEventListener('resize', () => {
            if (engine && typeof engine.checkResize === 'function') {
                engine.checkResize();
            }
            updateCanvasSize();
        });

        setInterval(updateInteractionInfo, 100);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    <script type="module">
        // Import the actual engine
        import { Unified4DEngine } from '../src/core/Unified4DEngine.js';

        // FPS Counter
        class FPSCounter {
            constructor() {
                this.frameCount = 0;
                this.lastTime = 0;
                this.fps = 0;
            }
            
            update(timestamp) {
                this.frameCount++;
                if (timestamp - this.lastTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (timestamp - this.lastTime));
                    this.frameCount = 0;
                    this.lastTime = timestamp;
                    document.getElementById('fps').textContent = this.fps;
                }
            }
        }

        // Global variables
        let engine = null;
        window.fpsCounter = new FPSCounter();

        // Themes (can be aligned with GeometryType keys for simplicity if desired)
        const themes = {
            hypercube: {
                primary: [1.0, 0.2, 0.8],
                secondary: [0.2, 1.0, 1.0],
                background: [0.05, 0.0, 0.2]
            },
            tetrahedron: { // Corresponds to 'TETRAHEDRON'
                primary: [0.2, 1.0, 1.0],
                secondary: [1.0, 1.0, 1.0],
                background: [0.0, 0.1, 0.2]
            },
            hypersphere: { // Corresponds to 'HYPERSPHERE'
                primary: [1.0, 1.0, 0.0],
                secondary: [1.0, 0.5, 0.0],
                background: [0.1, 0.1, 0.0]
            },
            // Add other themes if necessary
        };

        // Initialize
        function init() {
            const canvas = document.getElementById('visualization');
            
            try {
                // Initial geometry can be set here
                engine = new Unified4DEngine(canvas, {
                    geometry: 'HYPERCUBE', // Use actual GeometryType key
                    theming: themes.hypercube
                });
                
                engine.start();
                updateStatus('Running successfully! 🚀');
                
                // Update info
                document.getElementById('webglVersion').textContent = engine.isWebGL2 ? 'WebGL 2.0' : 'WebGL 1.0';
                updateCanvasSize();
                
            } catch (error) {
                console.error('Failed to initialize:', error);
                updateStatus('❌ Initialization failed: ' + error.message);
            }
        }

        // Control functions
        window.updateParameter = function(name, value) {
            if (!engine) return;
            
            const numValue = parseFloat(value);
            engine.updateParameters({ [name]: numValue });
            // Ensure the span ID matches for value display
            const valueSpan = document.getElementById(name + 'Value');
            if (valueSpan) {
                valueSpan.textContent = numValue.toFixed(name === 'lineThickness' ? 3 : (name === 'dimension' ? 1: 2) );
            }
        };

        window.setGeometry = function(geometryKey) { // geometryKey should be 'HYPERCUBE', 'HYPERSPHERE', etc.
            if (!engine) return;
            
            // Update button states
            document.querySelectorAll('.button-group .btn').forEach(btn => {
                btn.classList.remove('active');
                // Match button text/id to geometryKey, this might need adjustment
                if (btn.textContent.toUpperCase().startsWith(geometryKey.substring(0,4))) { // Simple match
                    btn.classList.add('active');
                }
            });
            
            // Update theme if a corresponding theme exists
            const themeKey = geometryKey.toLowerCase();
            if (themes[themeKey]) {
                engine.updateConfig({ theming: themes[themeKey] });
                 // Update theme dropdown
                const themeSelect = document.querySelector('.control-group select');
                if (themeSelect) {
                    themeSelect.value = themeKey;
                }
            }
            
            // Key change: Call updateConfig to switch geometry
            engine.updateConfig({ geometry: geometryKey });

            updateStatus(\`Switched to \${geometryKey} geometry\`);
        };

        window.setTheme = function(themeName) { // themeName like 'hypercube', 'tetrahedron'
            if (!engine || !themes[themeName]) return;
            engine.updateConfig({ theming: themes[themeName] });
            updateStatus(\`Theme set to \${themeName}\`);
        };

        window.toggleEngine = function() {
            if (!engine) return;
            
            if (engine.isRendering) {
                engine.stop();
                updateStatus('Stopped');
            } else {
                engine.start();
                updateStatus('Running');
            }
        };

        window.resetParameters = function() {
            if (!engine) return;
            
            // Fetch default parameters from the engine's initial config if possible,
            // or use a predefined set like before. For now, using predefined.
            const defaults = {
                dimension: 4.0,
                morphFactor: 0.5,
                rotationSpeed: 0.2,
                gridDensity: 8.0,
                lineThickness: 0.03
            };
            
            engine.updateParameters(defaults);
            
            // Update UI
            Object.entries(defaults).forEach(([key, value]) => {
                const input = document.getElementById(key);
                if (input) {
                    input.value = value;
                    const valueSpan = document.getElementById(key + 'Value');
                     if (valueSpan) {
                         valueSpan.textContent = value.toFixed(key === 'lineThickness' ? 3 : (key === 'dimension' ? 1: 2));
                     }
                }
            });
            
            updateStatus('Parameters reset to defaults');
        };

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function updateCanvasSize() {
            const canvas = document.getElementById('visualization');
            document.getElementById('canvasSize').textContent = \`\${canvas.width}x\${canvas.height}\`;
        }

        function updateInteractionInfo() {
            if (!engine || !engine.config || !engine.config.parameters) return; // Add checks
            
            const params = engine.config.parameters;
            const interactions = [
                \`Bass: \${(params.audioBass * 100).toFixed(0)}%\`,
                \`Mid: \${(params.audioMid * 100).toFixed(0)}%\`,
                \`High: \${(params.audioHigh * 100).toFixed(0)}%\`
            ].join(' | ');
            
            document.getElementById('interactions').textContent = interactions;
        }

        // Window resize handling
        window.addEventListener('resize', () => {
            if(engine) engine.checkResize(); // Call engine's resize handler
            updateCanvasSize();
        });

        // Update interaction info periodically
        setInterval(updateInteractionInfo, 100);

        window.applyReactivityMapping = function() {
            if (!engine) return;

            const targetParameter = document.getElementById('reactivityTarget').value;
            const sourceType = document.getElementById('reactivitySource').value;
            const scale = parseFloat(document.getElementById('reactivityScale').value);
            const smoothingFactor = parseFloat(document.getElementById('reactivitySmoothing').value);

            const newMapping = {
                targetParameter: targetParameter,
                sourceType: sourceType,
                scale: scale,
                // Only add smoothingFactor if it's greater than 0, as undefined means no smoothing
                ...(smoothingFactor > 0 && { smoothingFactor: smoothingFactor })
            };

            // For simplicity in test, this replaces all existing mappings with the new one.
            // A more advanced test page might allow adding multiple mappings.
            const currentConfig = engine.getConfig();
            let updatedMappings = [newMapping];

            // Example: if you want to add to existing instead of replacing:
            // let updatedMappings = currentConfig.reactivityMappings ? [...currentConfig.reactivityMappings] : [];
            // updatedMappings.push(newMapping);


            engine.updateConfig({ reactivityMappings: updatedMappings });
            updateStatus(`Applied mapping: ${sourceType} to ${targetParameter}`);
        };

        window.clearReactivityMappings = function() {
            if (!engine) return;
            engine.updateConfig({ reactivityMappings: [] }); // Pass an empty array
            updateStatus('Cleared all custom reactivity mappings. Using default behavior.');
        };

        window.updateCustomReactivityValue = function(value) {
            if (!engine) return;
            const sourceName = document.getElementById('customSourceName').value.trim();
            const numValue = parseFloat(value);

            if (sourceName) {
                engine.setCustomReactivityValue(sourceName, numValue);
                document.getElementById('customSourceValueDisplay').textContent = numValue.toFixed(2);
            } else {
                console.warn("Custom source name is empty.");
            }
        };

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
